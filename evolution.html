<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Évolution de ma chambre 3D</title>
<style>
:root{--bg:#121311;--card:#1c1d1a;--ink:#F3EFE4;--mut:#a9a594;--ol:#A4AE6E;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;line-height:1.45}
main{max-width:860px;margin:0 auto;padding:20px 14px calc(30px + env(safe-area-inset-bottom))}
h1{font-size:26px;margin:4px 0 2px;letter-spacing:-.01em}.sub{color:var(--mut);font-size:14px;margin:0 0 16px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}nav a{color:var(--ink);text-decoration:none;font-size:14px;border:1px solid var(--line);border-radius:999px;padding:7px 13px;background:rgba(255,255,255,.04)}
.curve{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:22px}
.curve h2{font-size:15px;margin:0 0 8px;color:var(--mut);font-weight:600}
.big{font-size:40px;font-weight:700;color:var(--ol);line-height:1}.big small{font-size:16px;color:var(--mut);font-weight:500}
svg{display:block;width:100%;height:auto}
.s{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 14px;margin-bottom:18px}
.s .d{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.s h3{font-size:19px;margin:4px 0 8px}
.pill{display:inline-block;font-size:13px;font-weight:600;border-radius:999px;padding:4px 10px;background:rgba(164,174,110,.16);color:var(--ol);margin-bottom:10px}
ul{padding-left:18px;margin:6px 0 12px}li{margin:3px 0;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin:8px 0 14px}
.sc{font-size:13px;background:rgba(255,255,255,.04);border-radius:10px;padding:7px 9px}.sc b{float:right}.up b{color:var(--ol)}
.ba{position:relative;border-radius:12px;overflow:hidden;margin:10px 0 4px;touch-action:pan-y;user-select:none;-webkit-user-select:none;background:#000}
.ba img{display:block;width:100%;height:auto;pointer-events:none}
.ba .top{position:absolute;inset:0;clip-path:inset(0 50% 0 0)}
.ba .bar{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff;transform:translateX(-1px);box-shadow:0 0 8px rgba(0,0,0,.6)}
.ba .knob{position:absolute;top:50%;left:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#fff;color:#111;font-size:14px;display:flex;align-items:center;justify-content:center;font-weight:700}
.ba .lab{position:absolute;top:8px;font-size:11px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:6px;background:rgba(0,0,0,.55)}
.cap{font-size:13px;color:var(--mut);margin-bottom:12px}
.next{font-size:14px;color:var(--mut);border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
</style></head><body><main>
<h1>Évolution de ma chambre 3D</h1>
<p class="sub">Chaque nuit, une séance d'entraînement améliore la chambre. Règle : chaque version doit être meilleure que la précédente. Glisse le curseur sur les images pour comparer avant / après.</p>
<nav><a href="./">Visite VR</a><a href="#seances">Séances</a></nav>
<section class="curve"><h2>Score total</h2><div id="big" class="big"></div><div id="chart"></div></section>
<div id="seances"></div>
</main>
<script src="evolution/sessions.js"></script>
<script>
const S=window.SESSIONS||[],K=[["meubles","Meubles"],["eclairage","Éclairage"],["coherence","Plan ↔ liste"],["liste","Liste d'achat"],["vr","VR Quest 2"],["plan","Plan 3D"],["video","Vidéo"]];
const fr=v=>v==null?'':String(Math.round(v*10)/10).replace('.',',');const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const last=S[0];document.getElementById('big').innerHTML=last?`${fr(last.apres)}<small> / 70</small>`:'';
// courbe
(()=>{const pts=S.slice().reverse().map(s=>s.apres);if(pts.length<1)return;const W=600,H=150,p=28,mn=Math.min(...pts)-2,mx=Math.max(...pts)+2;
const x=i=>pts.length<2?W/2:p+i*(W-2*p)/(pts.length-1),y=v=>H-p-(v-mn)/(mx-mn)*(H-2*p);
let d=pts.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
let c=pts.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="5" fill="#A4AE6E"/><text x="${x(i)}" y="${y(v)-11}" fill="#F3EFE4" font-size="13" text-anchor="middle">${fr(v)}</text><text x="${x(i)}" y="${H-6}" fill="#a9a594" font-size="11" text-anchor="middle">${i?'S'+i:'Réf.'}</text>`).join('');
document.getElementById('chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}"><path d="${d}" fill="none" stroke="#A4AE6E" stroke-width="2.5"/>${c}</svg>`})();
// séances
document.getElementById('seances').innerHTML=S.map(s=>{
 const pill=s.avant==null?`Score de départ : ${fr(s.apres)}/70`:`Score ${fr(s.avant)} → ${fr(s.apres)} / 70 (${s.apres-s.avant>=0?'+':''}${fr(s.apres-s.avant)})`;
 const sc=K.map(([k,n])=>{const v=s.scores[k];if(!v)return'';const up=v[0]!=null&&v[1]>v[0];return`<div class="sc${up?' up':''}">${n}<b>${v[0]!=null?fr(v[0])+' → ':''}${fr(v[1])}</b></div>`}).join('');
 const im=s.images.map(([f,t])=>`<div class="ba"><img src="evolution/${s.date}/apres_${f}.jpg" alt="Après : ${esc(t)}" loading="lazy"><div class="top"><img src="evolution/${s.date}/avant_${f}.jpg" alt="Avant : ${esc(t)}" loading="lazy"></div><span class="lab" style="left:8px">AVANT</span><span class="lab" style="right:8px">APRÈS</span><div class="bar"></div><div class="knob">⇆</div></div><div class="cap">${esc(t)}</div>`).join('');
 return`<article class="s"><div class="d">${esc(s.date)}</div><h3>${esc(s.titre)}</h3><span class="pill">${pill}</span><ul>${s.changements.map(c=>`<li>${esc(c)}</li>`).join('')}</ul><div class="grid">${sc}</div>${s.video?`<video src="${s.video}" poster="${s.poster||''}" controls playsinline preload="none" style="${s.vertical?'display:block;width:100%;max-width:340px;margin:10px auto 4px':'width:100%;margin:10px 0 4px'};border-radius:12px;background:#000"></video><div class="cap"${s.vertical?' style="text-align:center"':''}>${esc(s.videoCap||'Vidéo de visite (1 min 08)')}</div>`:''}${im}${s.ensuite?`<div class="next">Prochaine étape : ${esc(s.ensuite)}</div>`:''}</article>`}).join('');
// curseurs avant/après
document.querySelectorAll('.ba').forEach(b=>{const top=b.querySelector('.top'),bar=b.querySelector('.bar'),kn=b.querySelector('.knob');
 const set=cx=>{const r=b.getBoundingClientRect();let f=Math.min(1,Math.max(0,(cx-r.left)/r.width));top.style.clipPath=`inset(0 ${(1-f)*100}% 0 0)`;bar.style.left=kn.style.left=f*100+'%'};
 let on=false;b.addEventListener('pointerdown',e=>{on=true;set(e.clientX)});addEventListener('pointermove',e=>{if(on)set(e.clientX)});addEventListener('pointerup',()=>on=false);
 b.addEventListener('touchmove',e=>{set(e.touches[0].clientX)},{passive:true});});
</script>
</body></html>
