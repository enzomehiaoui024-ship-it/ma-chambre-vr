<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ma chambre en 3D</title>
<style>
html,body{margin:0;height:100%;background:#141413;color:#F6F2E8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;overflow:hidden}
#view{position:absolute;inset:0}
#ui{position:absolute;left:0;right:0;bottom:0;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(10,10,9,.82) 28%);}
.row{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}.row::-webkit-scrollbar{display:none}
.lbl{font-size:11px;letter-spacing:.08em;color:#C9D19A;margin:6px 2px 0}
button{flex:0 0 auto;font:inherit;font-size:14px;color:#F6F2E8;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:8px 14px;cursor:pointer}
button.on{background:#A4AE6E;border-color:#A4AE6E;color:#1b1d12}
#play{width:100%;margin-top:8px;padding:11px;border-radius:12px;background:#F6F2E8;color:#1b1b19;font-weight:600;border:none}
#cap{position:absolute;left:16px;right:16px;top:calc(14px + env(safe-area-inset-top));opacity:0;transition:opacity .5s;pointer-events:none;border-left:4px solid #A4AE6E;padding:4px 0 4px 12px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
#capL{font-size:11px;letter-spacing:.12em;color:#C9D19A}#capT{font-size:22px;font-weight:600;margin-top:2px}#capS{font-size:14px;opacity:.85}
#hint{position:absolute;z-index:5;top:calc(14px + env(safe-area-inset-top));left:12px;font-size:12px;background:rgba(10,10,9,.55);padding:5px 10px;border-radius:999px;transition:opacity .6s}#hint.off{opacity:0}
#evo{position:fixed;top:calc(8px + env(safe-area-inset-top));right:10px;z-index:9;font:600 13px -apple-system,sans-serif;color:#1b1d12;background:#A4AE6E;border-radius:999px;padding:6px 12px;text-decoration:none}
#card{position:absolute;z-index:8;left:10px;right:10px;top:calc(50px + env(safe-area-inset-top));max-width:420px;background:rgba(18,18,16,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(164,174,110,.45);border-radius:16px;padding:12px 14px 14px;transform:translateY(-12px);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-height:55vh;overflow:auto}
#card.on{opacity:1;transform:none;pointer-events:auto}
#card .cx{position:absolute;top:6px;right:6px;width:34px;height:34px;padding:0;border-radius:50%;font-size:20px;line-height:1}
#card .cz{font-size:11px;letter-spacing:.1em;color:#C9D19A;text-transform:uppercase}#card .cn{font-size:18px;font-weight:600;margin:2px 36px 2px 0}#card .cm{font-size:13px;opacity:.8}
#card .cp{font-size:15px;margin-top:8px}#card .cp b{font-size:20px;color:#F6F2E8}#card .ok{font-size:11px;color:#1b1d12;background:#A4AE6E;border-radius:999px;padding:2px 7px;margin-left:4px;vertical-align:2px}
#card .cnote{font-size:12.5px;opacity:.75;margin-top:6px;line-height:1.4}#card .cl{display:inline-block;margin-top:10px;color:#1b1d12;background:#F6F2E8;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;text-decoration:none}
#card .cal{font-size:11px;letter-spacing:.1em;color:#C9D19A;margin-top:12px}#card .cas{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}#card .ca{font-size:12.5px;padding:6px 10px}
#mesL{position:absolute;inset:0;pointer-events:none;z-index:4}#mesL div{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font:600 12px -apple-system,BlinkMacSystemFont,sans-serif;color:#1b1d12;background:#D8E48A;border-radius:999px;padding:3px 8px;box-shadow:0 1px 6px rgba(0,0,0,.45)}#mesL div.p{background:#F6F2E8}#mesL div small{font-weight:500;opacity:.75;margin-right:4px}
</style></head><body>
<a id="evo" href="https://enzomehiaoui024-ship-it.github.io/ma-chambre-vr/evolution.html" target="_blank">Mon évolution →</a>
<div id="view"></div>
<div id="card"></div>
<div id="mesL"></div>
<div id="hint">1 doigt : tourner · 2 doigts : zoom · touche un meuble : sa fiche</div>

<div id="ui">
<div class="lbl">ÉCLAIRAGE</div>
<div class="row"><button data-mode="cosy">Nuit cosy</button><button data-mode="jour">Jour</button><button data-mode="coucher">Coucher de soleil</button><button data-mode="soir">Soir chaud</button><button data-mode="gaming">Gaming</button><button data-mode="fete">Fête</button><button data-mode="cine">Ciné Ambilight</button><button id="auto">Défilé de toutes les ambiances</button></div>
<div class="lbl">BUREAU (test)</div>
<div class="row"><button data-setup="actuel" class="on">Bureau actuel</button><button data-setup="v1">Setup photo 1</button><button data-setup="v2">Setup photo 2 (3 écrans)</button><button data-setup="v3">Setup photo 3</button></div>
<div class="lbl">VUES</div>
<div class="row"><button id="mes">📏 Mesures</button><button data-view="ens">Ensemble</button><button data-view="fenetre">Fenêtre et lune</button><button data-view="lit">Lit</button><button data-view="ambi">TV Ambilight</button><button data-view="tv">Commode et TV</button><button data-view="vinyle">Vinyles</button><button data-view="bureau">Bureau gaming</button><button data-view="dessus">Vu de dessus</button></div>
<button id="play">&#9654;&nbsp; Lancer la visite</button>
</div>
<script src="items.js"></script><script src="catalog.js"></script><script src="mesures.js"></script><script>window.__LATTES=true;window.__SETUPS=true</script><script src="shim2.js"></script><script src="room.js"></script><script src="gl2.js"></script><script src="ambi.js"></script>
<script src="app_gl.js"></script>
<script>(function(){const h=document.getElementById('hint');if(!h)return;const off=()=>{setTimeout(()=>h.classList.add('off'),2500)};addEventListener('pointerdown',off,{once:true});setTimeout(()=>h.classList.add('off'),9000)})()</script>
<script>document.querySelectorAll("[data-setup]").forEach(b=>b.onclick=()=>{__R.setSetup(b.dataset.setup);document.querySelectorAll("[data-setup]").forEach(x=>x.classList.toggle("on",x===b));if(window.__jump)__jump("bureau")});</script>
</body></html>
